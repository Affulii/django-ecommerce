{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create Account - MY STORE</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">

    <style>
      body {
        background-color: #f8f9fa;
      }
      .signup-card {
        max-width: 480px;
        border: none;
        border-radius: 12px;
      }
    </style>
  </head>
  <body class="d-flex flex-column min-vh-100">

    {% include 'navbar.html' %}

    <main class="container my-auto py-5">
      <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6">
          
          <div class="card signup-card shadow-lg p-4 p-md-5 mx-auto">
            
            <!-- Header -->
            <div class="text-center mb-4">
              <div class="bg-danger-subtle text-danger rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width: 60px; height: 60px;">
                <i class="bi bi-person-plus-fill fs-2"></i>
              </div>
              <h3 class="fw-bold m-0">Create an Account</h3>
              <p class="text-muted small">Join us to start shopping and tracking your orders</p>
            </div>

            <!-- Django Messages / Errors -->
            {% if messages %}
              {% for message in messages %}
                <div class="alert alert-danger alert-dismissible fade show text-center small py-2 mb-4" role="alert">
                  <i class="bi bi-exclamation-circle-fill me-1"></i> {{ message }}
                  <button type="button" class="btn-close py-2" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
              {% endfor %}
            {% endif %}

            <!-- Signup Form -->
            <form action="{% url 'sign_up' %}" method="POST">
              {% csrf_token %}

              <!-- Username Field -->
              <div class="form-floating mb-3">
                <input 
                  type="text" 
                  name="username" 
                  class="form-control" 
                  id="floatingUsername" 
                  placeholder="Username" 
                  required
                >
                <label for="floatingUsername"><i class="bi bi-person me-1"></i> Username</label>
              </div>

              <!-- Email Field -->
              <div class="form-floating mb-3">
                <input 
                  type="email" 
                  name="email" 
                  class="form-control" 
                  id="floatingEmail" 
                  placeholder="Email" 
                  required
                >
                <label for="floatingEmail"><i class="bi bi-envelope me-1"></i> Email Address</label>
              </div>

              <!-- Password Field -->
              <div class="form-floating mb-3">
                <input 
                  type="password" 
                  name="password" 
                  class="form-control" 
                  id="floatingPassword" 
                  placeholder="Password" 
                  required
                >
                <label for="floatingPassword"><i class="bi bi-lock me-1"></i> Password</label>
              </div>

              <!-- Confirm Password Field -->
              <div class="form-floating mb-4">
                <input 
                  type="password" 
                  name="confirm_password" 
                  class="form-control" 
                  id="floatingConfirmPassword" 
                  placeholder="Confirm Password" 
                  required
                >
                <label for="floatingConfirmPassword"><i class="bi bi-shield-lock me-1"></i> Confirm Password</label>
              </div>

              <!-- Submit Button -->
              <button type="submit" class="btn btn-danger btn-lg w-100 fw-semibold shadow-sm mb-3">
                Sign Up
              </button>

            </form>

            <!-- Login Redirect -->
            <div class="text-center mt-3 pt-3 border-top">
              <p class="text-muted small mb-0">
                Already have an account? 
                <a href="{% url 'login' %}" class="text-danger fw-bold text-decoration-none ms-1">Log in here</a>
              </p>
            </div>

          </div>

        </div>
      </div>
    </main>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
