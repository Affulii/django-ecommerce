<style>
  :root {
    --nav-bg: rgba(255, 255, 255, 0.85);
    --nav-text: #1e293b;
    --nav-muted: #64748b;
    --nav-accent: #2563eb;
    --nav-hover-bg: #f1f5f9;
    --nav-danger: #ef4444;
  }

  /* Main Navigation Container */
  .custom-navbar {
    position: sticky;
    top: 0;
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0.75rem 2rem;
    background-color: var(--nav-bg);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(226, 232, 240, 0.8);
    font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }

  /* Logo */
  .custom-navbar .logo {
    font-size: 1.25rem;
    font-weight: 800;
    letter-spacing: -0.025em;
    color: var(--nav-text);
    text-transform: uppercase;
  }

  /* Search Bar */
  .custom-navbar .search-bar {
    display: flex;
    align-items: center;
    background-color: #f8fafc;
    border: 1px solid #e2e8f0;
    border-radius: 9999px;
    padding: 0.25rem 0.5rem 0.25rem 1rem;
    width: 100%;
    max-width: 320px;
    transition: all 0.2s ease;
  }

  .custom-navbar .search-bar:focus-within {
    border-color: var(--nav-accent);
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    background-color: #ffffff;
  }

  .custom-navbar .search-bar input {
    border: none;
    background: transparent;
    outline: none;
    font-size: 0.875rem;
    color: var(--nav-text);
    width: 100%;
  }

  .custom-navbar .search-bar button {
    border: none;
    background-color: var(--nav-accent);
    color: #ffffff;
    font-weight: 600;
    font-size: 0.8rem;
    padding: 0.4rem 0.85rem;
    border-radius: 9999px;
    cursor: pointer;
    transition: background 0.2s ease;
  }

  .custom-navbar .search-bar button:hover {
    background-color: #1d4ed8;
  }

  /* Navigation Links List */
  .custom-navbar ul {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    margin: 0;
    padding: 0;
    list-style: none;
  }

  .custom-navbar li {
    position: relative;
  }

  .custom-navbar a {
    text-decoration: none;
    color: var(--nav-text);
    font-size: 0.9rem;
    font-weight: 500;
    padding: 0.5rem 0.85rem;
    border-radius: 0.5rem;
    display: inline-block;
    transition: all 0.2s ease;
  }

  .custom-navbar a:hover {
    background-color: var(--nav-hover-bg);
    color: var(--nav-accent);
  }

  /* Dropdown Styling */
  .custom-navbar .dropdown-menu {
    display: none;
    position: absolute;
    top: 100%;
    left: 0;
    background-color: #ffffff;
    min-width: 180px;
    box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
    padding: 0.5rem;
    margin: 0;
    list-style: none;
    border-radius: 0.75rem;
    border: 1px solid #f1f5f9;
    z-index: 1000;
    animation: fadeIn 0.15s ease-in-out;
  }

  .custom-navbar .dropdown-menu li {
    display: block;
    width: 100%;
  }

  .custom-navbar .dropdown-menu li a {
    color: var(--nav-text);
    padding: 0.5rem 0.75rem;
    border-radius: 0.375rem;
    display: block;
    font-size: 0.85rem;
  }

  .custom-navbar .dropdown-menu li a:hover {
    background-color: var(--nav-hover-bg);
    color: var(--nav-accent);
  }

  .custom-navbar .dropdown-menu li a.logout-link:hover {
    background-color: #fef2f2;
    color: var(--nav-danger) !important;
  }

  /* Hover trigger with a invisible bridge padding to prevent closing on gap */
  .custom-navbar .dropdown:hover .dropdown-menu {
    display: block;
  }

  @keyframes fadeIn {
    from {
      opacity: 0;
      transform: translateY(4px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }
</style>

<nav class="custom-navbar">
  <!-- Brand Logo -->
  <div class="logo">
    My store 
  </div>

  <!-- Search Bar -->
  <form class="search-bar" action="{% url 'shop' %}" method="GET">
    <input type="text" name="q" value="{{ query|default:'' }}" placeholder="Search products..." aria-label="Search">
    <button type="submit">Search</button>
  </form>

  <!-- Navigation Links -->
  <ul>
    <li><a href="{% url 'home' %}">Home</a></li>
      
    <!-- Hover Dropdown Categories Menu -->
    <li class="dropdown">
      <a href="{% url 'categories' %}">Categories ▾</a>
      <ul class="dropdown-menu">
        <li><a class="phones" href="{% url 'category_phones' %}">Phones</a></li>
        <li><a class="laptops" href="{% url 'category_laptops' %}">Laptops</a></li>
        <li><a class="accessories" href="{% url 'category_accessories' %}">Accessories</a></li>
      </ul>
    </li>

    <li><a href="/cart/">Cart</a></li>
      
    <li><a href="{% url 'about' %}">About Us</a></li>

    <!-- Authentication Links -->
    {% if user.is_authenticated %}
      <!-- User Dropdown Menu -->
      <li class="dropdown">
        <a href="{% url 'profile' %}">Hi, {{ user.username }} ▾</a>
        <ul class="dropdown-menu">
          <li><a href="{% url 'profile' %}">My Account</a></li>
          <!-- <li><a href="{% url 'track_order' %}">My Orders</a></li> -->
          <li><a href="{% url 'logout' %}" class="logout-link" style="color: var(--nav-danger);">Logout</a></li>
        </ul>
      </li>
    {% else %}
      <li><a href="{% url 'login' %}">Login</a></li>
      <li><a href="{% url 'sign_up' %}" style="background-color: var(--nav-accent); color: #ffffff;">Sign Up</a></li>
    {% endif %}
  </ul>   
</nav>
