<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MY STORE</title>
    <!-- Bootstrap 5 CSS & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

    <!-- Custom Back Button Styles -->
    <style>
        .btn-back-custom {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 16px;
            border-radius: 50rem;
            font-weight: 600;
            font-size: 0.875rem;
            color: #ffffff;
            background-color: #212529;
            border: 1px solid #495057;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
            transition: all 0.25s ease-in-out;
            text-decoration: none;
            cursor: pointer;
        }

        .btn-back-custom:hover {
            background-color: #dc3545;
            color: #ffffff;
            border-color: #dc3545;
            transform: translateX(-3px);
            box-shadow: 0 4px 12px rgba(220, 53, 69, 0.3);
        }

        .btn-back-custom i {
            transition: transform 0.25s ease-in-out;
        }

        .btn-back-custom:hover i {
            transform: translateX(-2px);
        }
    </style>
</head>
<body class="bg-dark text-white d-flex flex-column min-vh-100">

    <!-- Global Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-black bg-opacity-75 sticky-top border-bottom border-secondary">
        <div class="container">
            <!-- Brand Logo -->
            <a class="navbar-brand fw-bold text-danger fs-4" href="{% url 'shop' %}">
                <i class="bi bi-bag-check-fill me-2"></i>ExpressStore
            </a>

            <!-- Mobile Toggle Button -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Links & Cart Badge -->
            <div class="collapse navbar-collapse" id="navbarContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-4">
                    <li class="nav-item">
                        <a class="nav-link text-white" href="{% url 'shop' %}">Storefront</a>
                    </li>
                </ul>
                <!-- Action Buttons: Keep Shopping & Cart -->
                <div class="d-flex align-items-center gap-2">
                    <!-- Keep Shopping Button -->
                    <a href="{% url 'shop' %}" class="btn btn-outline-secondary text-white rounded-pill px-3">
                        <i class="bi bi-arrow-left me-1"></i> Keep Shopping
                    </a>    

                    <!-- Cart Button -->
                    <div class="d-flex align-items-center">
                        <a href="{% url 'cart_detail' %}" class="btn btn-outline-light rounded-pill px-3 position-relative">
                            <i class="bi bi-cart3 me-1"></i> Cart
                            <!-- Dynamic Cart Quantity Badge -->
                            {% if cart %}
                            <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">
                                {{ cart|length }}
                            </span>
                            {% endif %}
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- DYNAMIC BACK BUTTON (Hides on 'shop' homepage) -->
    {% if request.resolver_match.url_name != 'shop' %}
        <div class="container mt-4 mb-0">
            <button onclick="history.back()" type="button" class="btn btn-back-custom">
                <i class="bi bi-arrow-left"></i>
                <span>Back</span>
            </button>
        </div>
    {% endif %}

    <!-- Page Content Container -->
    <main class="container my-5 flex-grow-1">
        {% block content %}
        <!-- Page contents (cart, products, checkout) render here -->
        {% endblock %}
    </main>

    <!-- Footer -->
    <footer class="bg-black text-white-50 text-center py-3 border-top border-secondary mt-auto">
        <p class="mb-0 small">&copy; 2026 ExpressStore. All rights reserved.</p>
    </footer>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
